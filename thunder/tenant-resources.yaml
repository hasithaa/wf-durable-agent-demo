# The tenant app's identity, declared: the cast, their groups (the roles the services gate on) and the portal.
#
# Thunder loads this multi-document YAML at startup; declarative resources are read-only at runtime.
# ${PORTAL_REDIRECT_URI} is rendered by the compose entrypoint (Thunder does not substitute it in a startup file).
# Group NAMES travel in the token's `groups` claim and are used as role names as they are.

resource_type: user
id: user-tara
type: Person
ouId: 01900000-0000-7000-8000-000000000001
attributes:
  username: tara
  email: tara@tenant-app.dev
  given_name: Tara
  family_name: Lee
credentials:
  password: "tara12345"
