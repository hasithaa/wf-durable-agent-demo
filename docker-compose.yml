# Tenant maintenance: a durable AI agent that runs each request end to end, on the commons services.
#   ./build.sh && docker compose up -d      then open http://localhost:9095
name: tenant-app

services:
  # ── Durable execution ───────────────────────────────────────────────────────
  temporal-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: temporal
      POSTGRES_PASSWORD: temporal
    volumes:
      - temporal-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U temporal"]
      interval: 5s
      timeout: 5s
      retries: 20

  temporal:
    image: temporalio/auto-setup:${TEMPORAL_TAG:-1.29.7}
    environment:
      DB: postgres12
      DB_PORT: 5432
      POSTGRES_SEEDS: temporal-postgres
      POSTGRES_USER: temporal
      POSTGRES_PWD: temporal
      DBNAME: temporal
      VISIBILITY_DBNAME: temporal_visibility
      ENABLE_ES: "false"
      DEFAULT_NAMESPACE: default
      # Closed runs are deleted after retention; a month keeps finished requests inspectable.
      DEFAULT_NAMESPACE_RETENTION: 720h
    depends_on:
      temporal-postgres:
        condition: service_healthy
    healthcheck:
      # The frontend binds the container's own address, not 127.0.0.1.
      test: ["CMD-SHELL", "temporal operator cluster health --address $$(hostname -i):7233 | grep -q SERVING"]
      interval: 10s
      timeout: 10s
      retries: 30
      start_period: 60s

  temporal-ui:
    image: temporalio/ui:2.53.3
    profiles: [ui]
    environment:
      TEMPORAL_ADDRESS: temporal:7233
      TEMPORAL_CORS_ORIGINS: http://localhost:${TEMPORAL_UI_PORT:-8233}
    ports:
      - "${TEMPORAL_UI_PORT:-8233}:8080"
    depends_on:
      temporal:
        condition: service_healthy

  # ── Identity ────────────────────────────────────────────────────────────────
  # Renders the declarative identity, runs first-boot setup once, then serves it. The config and database
  # volumes must live and die together.
  thunder:
    image: ghcr.io/thunder-id/thunderid:1.0.0
    entrypoint: ["sh", "-c"]
    command:
      - |
        sed -e "s|\$${PORTAL_REDIRECT_URI}|$${PORTAL_REDIRECT_URI}|g" \
            /opt/tenant-app/tenant-resources.yaml > /opt/thunderid/tenant-app.yaml
        [ -f config/certs/crypto.key ] || ./setup.sh
        exec ./start.sh /opt/thunderid/tenant-app.yaml
    environment:
      ADMIN_USERNAME: ${THUNDER_ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${THUNDER_ADMIN_PASSWORD:-admin12345}
      DIRECT_AUTH_SECRET: ${THUNDER_DIRECT_AUTH_SECRET:-tenant-app-direct-secret}
      PORTAL_REDIRECT_URI: ${PORTAL_PUBLIC_URL:-http://localhost:9095}/callback
    volumes:
      - thunder-data:/opt/thunderid/config
      - thunder-db:/opt/thunderid/database
      - ./thunder/tenant-resources.yaml:/opt/tenant-app/tenant-resources.yaml:ro
      # Demo-only TLS pair generated by build.sh; its SANs cover `localhost` (the browser) and `thunder` (the JWKS fetch).
      - ./thunder/tls/server.cert:/opt/thunderid/config/certs/server.cert:ro
      - ./thunder/tls/server.key:/opt/thunderid/config/certs/server.key:ro
    ports:
      - "${THUNDER_PORT:-8090}:8090"

  # ── Local model (profile: ollama; build.sh pulls the model into the volume) ──
  ollama:
    image: ollama/ollama:${OLLAMA_TAG:-latest}
    profiles: [ollama]
    volumes:
      - ollama-models:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 30

  # ── The app ─────────────────────────────────────────────────────────────────
  # One process: notification, chat and attachment services, the durable maintenance agent and the app API.
  integration:
    build:
      context: ./integration
    image: tenant-app/integration:local
    environment:
      JAVA_TOOL_OPTIONS: -Xmx512m --enable-native-access=ALL-UNNAMED --sun-misc-unsafe-memory-access=allow
      TEMPORAL_URL: temporal:7233
      THUNDER_ISSUER: ${THUNDER_PUBLIC_URL:-https://localhost:8090}
      THUNDER_JWKS_URL: https://thunder:8090/oauth2/jwks
      SERVICE_API_KEY: ${SERVICE_API_KEY:-tenant-app-service-key}
      WEBHOOK_SECRET: ${WEBHOOK_SECRET:-tenant-app-webhook-secret}
      DEMO_SECONDS_PER_HOUR: ${DEMO_SECONDS_PER_HOUR:-2.5}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-auto}
      OLLAMA_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:7b}
      WSO2_AI_SERVICE_URL: ${WSO2_AI_SERVICE_URL:-}
      WSO2_AI_TOKEN: ${WSO2_AI_TOKEN:-}
    volumes:
      - app-data:/data
    depends_on:
      temporal:
        condition: service_healthy
      thunder:
        condition: service_started
      ollama:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD-SHELL", "curl -s -o /dev/null -w '%{http_code}' localhost:9090/app/requests | grep -q 401"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  webapp:
    image: nginx:1.27-alpine
    volumes:
      - ./webapp/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./webapp/public:/usr/share/nginx/html:ro
      - ./webapp/public/config.compose.js:/usr/share/nginx/html/config.js:ro
    ports:
      - "${PORTAL_PORT:-9095}:8080"
    depends_on:
      integration:
        condition: service_healthy

volumes:
  ollama-models:
  temporal-postgres-data:
  thunder-data:
  thunder-db:
  app-data:
