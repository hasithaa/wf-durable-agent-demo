<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tenant Maintenance</title>
  <link rel="stylesheet" href="styles.css">
  <script src="config.js"></script>
  <script type="module" src="vendor/notification-ui.bundle.js"></script>
  <script type="module" src="vendor/chat-ui.bundle.js"></script>
  <script type="module" src="vendor/attachment-ui.bundle.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">🔧 Tenant Maintenance</div>
    <div class="who" id="who"></div>
    <commons-notification-bell id="bell"></commons-notification-bell>
  </header>
  <main class="layout">
    <nav class="sidebar">
      <section id="new-request" hidden>
        <h2>Report a problem</h2>
        <form id="request-form">
          <input name="title" placeholder="Short title, e.g. Kitchen sink leaking" required>
          <input name="unit" placeholder="Unit, e.g. 4B" required>
          <textarea name="issue" rows="3" placeholder="What is happening?" required></textarea>
          <button type="submit">Send to maintenance</button>
        </form>
      </section>
      <section>
        <h2 id="requests-title">Requests</h2>
        <ul class="list" id="requests"></ul>
      </section>
      <section>
        <h2>Conversations</h2>
        <commons-conversation-list id="conversations"></commons-conversation-list>
      </section>
    </nav>
    <section class="main" id="main">
      <div class="empty" id="empty">Select a conversation or a request.</div>
      <commons-conversation id="chat" hidden></commons-conversation>
      <div class="detail" id="detail" hidden></div>
    </section>
    <aside class="side">
      <section id="tasks-panel" hidden>
        <h2>Approvals</h2>
        <ul class="list" id="tasks"></ul>
      </section>
      <section>
        <h2>Inbox</h2>
        <commons-inbox id="inbox"></commons-inbox>
      </section>
    </aside>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
