# The portal: the static SPA plus a same-origin proxy to the integration's services and Thunder's token
# endpoint, so the browser needs no CORS and no integration port is public.
user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    client_max_body_size 12m;

    # SSE streams stay open: no buffering, long reads.
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_read_timeout 1h;
    proxy_set_header Authorization $http_authorization;

    server {
        listen 8080;

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
        location /api/app/ {
            proxy_pass http://integration:9090/app/;
        }
        location /api/notifications/ {
            proxy_pass http://integration:9100/notifications/v1/;
        }
        location /api/chat/ {
            proxy_pass http://integration:9101/chat/v1/;
        }
        location /api/attachments/ {
            proxy_pass http://integration:9102/attachments/v1/;
        }
        location = /oidc/token {
            proxy_pass https://thunder:8090/oauth2/token;
            proxy_ssl_verify off;
        }
    }
}
